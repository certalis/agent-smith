name: Release

on:
  push:
    branches: [main]
    paths: [apps/tui/package.json]
  pull_request:
    paths: [.github/workflows/release.yml, apps/tui/package.json]
  workflow_dispatch:
    inputs:
      dryRun:
        description: Build and pack without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - id: pack
        working-directory: apps/tui
        run: |
          mkdir -p "$RUNNER_TEMP/npm"
          npm pack --pack-destination "$RUNNER_TEMP/npm"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error

  publish:
    needs: pack
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dryRun)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.pack.outputs.version }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm
      - id: registry
        run: |
          if npm view "@certalis/agent-smith@$VERSION" version > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.registry.outputs.published != 'true'
        run: npm publish npm/*.tgz
      - if: steps.registry.outputs.published != 'true'
        run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "agent-smith $VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
